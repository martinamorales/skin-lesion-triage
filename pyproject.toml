[project]
name = "skin-lesion-triage"
version = "0.1.0"
description = "Uncertainty-aware skin lesion classification with selective prediction (defer to expert)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Martina Morales" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = ["pytest>=8"]
notebooks = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

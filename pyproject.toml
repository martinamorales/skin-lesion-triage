[project]
name = "skin-lesion-triage"
version = "0.1.0"
description = "Uncertainty-aware skin lesion classification with selective prediction (defer to expert)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Martina Morales" }]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.11.8,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
